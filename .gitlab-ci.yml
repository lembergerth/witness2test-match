test:
  stage: test
  image: ${CI_REGISTRY_IMAGE}/ci:latest
  script:
    - make test

integration-test:
  stage: test
  image: ${CI_REGISTRY_IMAGE}/ci:latest
  script:
    - make integration-test
  artifacts:
    paths:
      - output/
    untracked: false
    when: on_failure
    expire_in: "7 days"

archive-test:
  stage: test
  image: golang:1.24.3-bookworm
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends python3 zip unzip
  script:
    - make archive-test

reuse:
  stage: test
  image:
    name: fsfe/reuse:5
    entrypoint: [""]
  script: reuse lint
  cache: []
  needs: []

lint:
  stage: test
  image: docker/golangci-lint:1.64.8-go1.24.3
  script:
    - make lint
