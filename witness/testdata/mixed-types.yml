#
# Mixes function_return waypoints with assumption / branching / function_enter
# / target / avoid waypoints. Parse must return only the four function_return
# follow waypoints, in document order.

- entry_type: "violation_sequence"
  metadata:
    format_version: "2.0"
    uuid: "00000000-0000-0000-0000-000000000002"
    creation_time: "2026-01-01T00:00:00Z"
    producer: { name: "test-fixture", version: "0" }
    task:
      input_files: [ "program.c" ]
      input_file_hashes: { "program.c": "deadbeef" }
      specification: "G ! call(reach_error())"
      data_model: "ILP32"
      language: "C"
  content:
  - segment:
    - waypoint:
        type: "branching"
        action: "follow"
        constraint: { value: "true" }
        location: { file_name: "program.c", line: 5, column: 3 }
  - segment:
    - waypoint:
        type: "function_return"
        action: "follow"
        constraint:
          value: "\\result == 0xff"
          format: "acsl_expression"
        location: { file_name: "program.c", line: 10, column: 45 }
  - segment:
    - waypoint:
        type: "assumption"
        action: "follow"
        constraint:
          value: "v == 0"
          format: "c_expression"
        location: { file_name: "program.c", line: 11, column: 3 }
  - segment:
    - waypoint:
        type: "function_return"
        action: "follow"
        constraint:
          value: "\\result == -3"
          format: "ext_c_expression"
        location: { file_name: "program.c", line: 18, column: 33 }
  - segment:
    - waypoint:
        type: "function_return"
        action: "avoid"
        constraint:
          value: "\\result == 9999"
          format: "acsl_expression"
        location: { file_name: "program.c", line: 18, column: 33 }
  - segment:
    - waypoint:
        type: "function_enter"
        action: "follow"
        location: { file_name: "program.c", line: 20, column: 3 }
  - segment:
    - waypoint:
        type: "function_return"
        action: "follow"
        constraint:
          value: "result == 1.5f"
          format: "c_expression"
        location: { file_name: "program.c", line: 22, column: 33 }
  - segment:
    - waypoint:
        type: "function_return"
        action: "follow"
        constraint:
          value: "\\result == 'A'"
          format: "acsl_expression"
        location: { file_name: "program.c", line: 24, column: 33 }
  - segment:
    - waypoint:
        type: "function_return"
        action: "follow"
        constraint:
          value: "\\result == true"
          format: "c_expression"
        location: { file_name: "program.c", line: 25, column: 33 }
  - segment:
    - waypoint:
        type: "target"
        action: "follow"
        location: { file_name: "program.c", line: 30, column: 5 }
