#
# Two violation_sequence entries in one document. Parse must collect waypoints
# from both, in document order.

- entry_type: "violation_sequence"
  metadata:
    format_version: "2.0"
    uuid: "00000000-0000-0000-0000-000000000003"
    creation_time: "2026-01-01T00:00:00Z"
    producer: { name: "test-fixture", version: "0" }
    task:
      input_files: [ "program.c" ]
      input_file_hashes: { "program.c": "deadbeef" }
      specification: "G ! call(reach_error())"
      data_model: "ILP32"
      language: "C"
  content:
  - segment:
    - waypoint:
        type: "function_return"
        action: "follow"
        constraint: { value: "\\result == 1", format: "acsl_expression" }
        location: { file_name: "program.c", line: 10, column: 45 }
- entry_type: "violation_sequence"
  metadata:
    format_version: "2.0"
    uuid: "00000000-0000-0000-0000-000000000004"
    creation_time: "2026-01-01T00:00:00Z"
    producer: { name: "test-fixture", version: "0" }
    task:
      input_files: [ "program.c" ]
      input_file_hashes: { "program.c": "deadbeef" }
      specification: "G ! call(reach_error())"
      data_model: "ILP32"
      language: "C"
  content:
  - segment:
    - waypoint:
        type: "function_return"
        action: "follow"
        constraint: { value: "\\result == 2", format: "acsl_expression" }
        location: { file_name: "program.c", line: 18, column: 33 }
